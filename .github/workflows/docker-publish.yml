name: Build and publish Docker image

# Same release model as Tide+:
# - A branch (run by hand with workflow_dispatch) or a pull request: tests and the browser check only.
# - Push to main with a new VERSION in app/main.py: the image is published as that version, `stable`
#   and `latest`, and a GitHub release v<VERSION> is made from RELEASE_NOTES.md. A push to main that
#   keeps the same VERSION only runs the checks.
# Builds a multi-arch image (amd64 + arm64) and pushes it to GHCR with the GITHUB_TOKEN Actions
# provides, so no extra secrets are needed.
#
# Image: ghcr.io/magicsolstone/solstone (the repository's owner, lowercased)
#
# First-time setup: after this runs once, open the package page on GitHub
# (your profile -> Packages -> solstone -> Package settings) and set its
# visibility to Public, otherwise `docker pull` gets a 401 -- GHCR packages
# start out private.

on:
  push:
    branches: [main]
  pull_request: {}            # Dependabot updates and other PRs: test only, never publish
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io

jobs:
  test:
    # A build that fails its own tests is never published to either channel.
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Run tests
        # Each failure is also posted as an annotation, so it can be read without the full log.
        run: |
          set -o pipefail
          pytest -q -rf --tb=short 2>&1 | tee pytest-out.txt || {
            grep -E "^(FAILED|ERROR) " pytest-out.txt | while read -r line; do echo "::error title=pytest::$line"; done
            grep -E "^E  " pytest-out.txt | head -40 | while read -r line; do echo "::error title=pytest detail::$line"; done
            exit 1
          }
      - name: Frontend syntax check
        run: for f in app/static/*.js; do node --check "$f"; done

  browser:
    # Opens every page in Chromium on a test world; fails on JS errors, broken pages
    # and Content-Security-Policy violations.
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Smoke test
        env:
          SMOKE_SHOTS: smoke-shots
        run: python tests/e2e/smoke.py
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-screenshots
          path: smoke-shots
          retention-days: 7

  release:
    needs: [test, browser]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Is this a new version?
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(sed -n 's/^VERSION = "\(.*\)"$/\1/p' app/main.py)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" --repo "${{ github.repository }}" > /dev/null 2>&1; then echo "new=no" >> "$GITHUB_OUTPUT"; else echo "new=yes" >> "$GITHUB_OUTPUT"; fi
          echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Stamp the build channel into app.js
        if: steps.version.outputs.new == 'yes'
        run: sed -i "s/__BUILD_CHANNEL__/stable/" app/static/app.js

      - name: Set up QEMU
        if: steps.version.outputs.new == 'yes'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: steps.version.outputs.new == 'yes'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: steps.version.outputs.new == 'yes'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.version.outputs.new == 'yes'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:stable
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          labels: org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Release
        if: steps.version.outputs.new == 'yes'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Solstone ${{ steps.version.outputs.version }}
          prerelease: false
          make_latest: true
          body_path: RELEASE_NOTES.md
