<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#23272e">
  <title>Lodestone</title>
  <link rel="icon" href="/static/lodestone.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="shell">
    <nav class="rail" aria-label="Servers">
      <a class="brand" href="#/" title="All servers">
        <img src="/static/lodestone.svg" alt="" width="34" height="34">
        <span>Lodestone</span>
      </a>
      <div class="rail-servers" id="rail-servers"></div>
      <div class="rail-foot"><span id="build-channel" class="channel" hidden></span></div>
    </nav>
    <main id="view" tabindex="-1"></main>
  </div>
  <div id="tooltip" class="mc-tooltip" role="tooltip" hidden></div>
  <div id="modal-root"></div>
  <div id="toast" class="toast" hidden></div>
  <script src="/static/app.js" defer></script>
</body>
</html>
