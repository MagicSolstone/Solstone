<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f1424">
  <title>{{SITE_NAME}}</title>
  <meta name="site-name" content="{{SITE_NAME}}">
  <link rel="icon" href="{{SITE_LOGO}}">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <canvas id="app-sky" aria-hidden="true"></canvas>
  <div class="shell">
    <!-- The website's own top bar: the same on the home page, the status page and here. Signed in, it adds the
         servers (a list drops down from ▾), Coming up and Fireworks; admins find their pages in the account menu. -->
    <header class="hp-top app-top">
      <a class="brand" href="/">
        <img src="{{SITE_LOGO}}" alt="" width="34" height="34">
        <span>{{SITE_NAME}}</span>
      </a>
      <nav class="hp-nav app-nav" aria-label="Site">
        <a href="/">Home</a><a href="/news">News</a><a href="/help">Help</a>
        <a href="/status" id="app-live" hidden>Live status</a>
        <span class="nav-drop"><a href="#/" id="nav-servers" aria-current="page">Servers</a><button type="button" class="nav-drop-btn" id="btn-servers"
            aria-haspopup="true" aria-expanded="false" aria-controls="rail-servers" aria-label="Pick a server">▾</button>
          <span class="drop-panel rail-servers glass" id="rail-servers" hidden></span></span>
        <a href="#/coming-up" id="btn-upcoming" data-app-nav>Coming up</a>
        <a href="#/fireworks" id="btn-fwe" data-app-nav>Fireworks</a>
        <a href="#/manage" id="nav-manage" hidden>⚙ Manage</a>
      </nav>
      <div class="account">
        <button class="btn sm" id="btn-account" type="button" aria-haspopup="menu" aria-expanded="false">👤 <span id="account-name"></span></button>
        <div class="account-menu" id="account-menu" role="menu" hidden>
          <div class="account-role" id="account-role"></div>
          <button type="button" role="menuitem" id="btn-display-name">Display name</button>
          <button type="button" role="menuitem" id="btn-password">Change password</button>
          <button type="button" role="menuitem" id="btn-logout">Sign out</button>
        </div>
      </div>
    </header>
    <div id="app-board" class="board-stack" hidden></div>
    <!-- Manage (admins): everything about the whole site in one place, each part a tab -->
    <nav class="manage-nav tabs" id="manage-nav" aria-label="Manage" hidden>
      <a href="#/manage/announcements" data-m="announcements">📣 Announcements</a>
      <a href="#/manage/website" data-m="website">🌐 Website</a>
      <a href="#/manage/users" data-m="users">👥 Users</a>
      <a href="#/manage/servers" data-m="servers">🖥 Servers &amp; status page</a>
      <a href="#/manage/fireworks" data-m="fireworks">🎆 Firework show</a>
      <a href="#/manage/activity" data-m="activity">📜 Activity log</a>
      <button type="button" class="manage-notify" id="btn-notify">🔔 Notifications</button>
    </nav>
    <main id="view" tabindex="-1"></main>
  </div>
  <div id="login-root" hidden></div>
  <div id="tooltip" class="mc-tooltip" role="tooltip" hidden></div>
  <div id="modal-root"></div>
  <div id="toast" class="toast" hidden></div>
  <script src="/static/sky.js" defer></script>
  <script src="/static/showbar.js" defer></script>
  <script src="/static/login.js" defer></script>
  <script src="/static/hud.js" defer></script>
  <script src="/static/board.js" defer></script>
  <script src="/static/recap.js" defer></script>
  <script src="/static/app.js" defer></script>
  <script src="/static/history.js" defer></script>
  <script src="/static/control.js" defer></script>
  <script src="/static/play.js" defer></script>
  <script src="/static/adventures.js" defer></script>
  <script src="/static/editor.js" defer></script>
  <script src="/static/fwsettings.js" defer></script>
  <script src="/static/announce.js" defer></script>
  <script src="/static/website.js" defer></script>
</body>
</html>
