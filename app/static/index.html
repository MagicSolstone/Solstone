<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f1424">
  <title>{{SITE_NAME}}</title>
  <meta name="site-name" content="{{SITE_NAME}}">
  <link rel="icon" href="/static/solstone.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <canvas id="app-sky" aria-hidden="true"></canvas>
  <div class="shell">
    <nav class="rail" aria-label="Servers">
      <a class="brand" href="#/" title="All servers">
        <img src="/static/solstone.svg" alt="" width="34" height="34">
        <span>{{SITE_NAME}}</span>
      </a>
      <span class="rail-title" id="rail-title" aria-hidden="true"></span>
      <button class="rail-menu-btn" id="btn-menu" type="button" aria-expanded="false" aria-controls="rail-servers" aria-label="Menu">☰</button>
      <div class="rail-servers" id="rail-servers"></div>
      <div class="rail-foot">
        <a class="rail-btn" id="btn-upcoming" href="#/coming-up">📅 <span>Coming up</span></a>
        <a class="rail-btn" id="btn-fwe" href="#/fireworks">🎆 <span>Fireworks</span></a>
        <a class="rail-btn" id="btn-music" href="#/music">🎵 <span>Music</span></a>
        <a class="rail-btn" id="btn-status" href="/status" target="_blank" rel="noopener" hidden>📺 <span>Live status</span></a>
        <button class="rail-btn admin-only" id="btn-notify" type="button">🔔 <span>Notifications</span></button>
        <a class="rail-btn admin-only" id="btn-announce" href="#/announcements">📣 <span>Announcements</span></a>
        <a class="rail-btn admin-only" id="btn-website" href="#/website">🌐 <span>Website</span></a>
        <a class="rail-btn admin-only" id="btn-admin" href="#/admin">👥 <span>Users &amp; activity</span></a>
        <div class="account">
          <button class="rail-btn" id="btn-account" type="button" aria-haspopup="menu" aria-expanded="false">👤 <span id="account-name"></span></button>
          <div class="account-menu" id="account-menu" role="menu" hidden>
            <div class="account-role" id="account-role"></div>
            <button type="button" role="menuitem" id="btn-display-name">Display name</button>
            <button type="button" role="menuitem" id="btn-password">Change password</button>
            <button type="button" role="menuitem" id="btn-logout">Sign out</button>
          </div>
        </div>
        <span id="build-channel" class="channel" hidden></span>
      </div>
    </nav>
    <div class="main-col">
      <div id="app-board" class="board-stack" hidden></div>
      <main id="view" tabindex="-1"></main>
    </div>
  </div>
  <div id="login-root" hidden></div>
  <div id="tooltip" class="mc-tooltip" role="tooltip" hidden></div>
  <div id="modal-root"></div>
  <div id="toast" class="toast" hidden></div>
  <script src="/static/sky.js" defer></script>
  <script src="/static/showbar.js" defer></script>
  <script src="/static/login.js" defer></script>
  <script src="/static/hud.js" defer></script>
  <script src="/static/board.js" defer></script>
  <script src="/static/recap.js" defer></script>
  <script src="/static/app.js" defer></script>
  <script src="/static/history.js" defer></script>
  <script src="/static/control.js" defer></script>
  <script src="/static/play.js" defer></script>
  <script src="/static/adventures.js" defer></script>
  <script src="/static/editor.js" defer></script>
  <script src="/static/fwsettings.js" defer></script>
  <script src="/static/announce.js" defer></script>
  <script src="/static/website.js" defer></script>
  <script src="/static/music.js" defer></script>
</body>
</html>
