<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f1424">
  <title>{{SITE_NAME}}</title>
  <meta name="site-name" content="{{SITE_NAME}}">
  <link rel="icon" href="{{SITE_LOGO}}">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <canvas id="app-sky" aria-hidden="true"></canvas>
  <div class="shell">
    <!-- The website's own top bar, the same on the home page and here: Home, News, Help, Events, Servers (a list
         drops down; with one server it goes straight there) and Manage for admins. Fireworks is in the account menu. -->
    <header class="hp-top app-top">
      <a class="brand" href="/">
        <img src="{{SITE_LOGO}}" alt="" width="34" height="34">
        <span>{{SITE_NAME}}</span>
      </a>
      <nav class="hp-nav app-nav" aria-label="Site">
        <a href="/" data-nav="home">Home</a>
        <a href="/news" data-nav="news">News</a>
        <a href="/help" data-nav="help">Help</a>
        <a href="/events" data-nav="events" data-signed-out>Events</a>
        <a href="/app#/events" data-nav="events" data-signed-in hidden>Events</a>
        <span class="nav-drop" data-signed-in hidden><button type="button" class="nav-drop-btn" id="btn-servers" data-nav="servers"
            aria-haspopup="true" aria-expanded="false" aria-controls="rail-servers">Servers<span class="caret" aria-hidden="true"> ▾</span></button>
          <span class="drop-panel rail-servers glass" id="rail-servers" hidden></span></span>
        <a href="/app#/manage" data-nav="manage" data-admin hidden aria-label="Manage">⚙<span class="nav-label"> Manage</span></a>
      </nav>
      <div class="account">
        <button class="btn sm" id="btn-account" type="button" aria-haspopup="menu" aria-expanded="false">👤 <span id="account-name"></span><span class="cm-badge" id="account-unread" hidden aria-label="unread messages"></span></button>
        <div class="account-menu" id="account-menu" role="menu" hidden>
          <div class="account-role" id="account-role"></div>
          <a role="menuitem" href="#/messages">✉️ Messages <span class="cm-badge" id="menu-unread" hidden></span></a>
          <a role="menuitem" href="#/votes">🗳️ Votes</a>
          <a role="menuitem" href="#/fireworks" id="btn-fwe">🎆 Fireworks</a>
          <a role="menuitem" href="#/manage" data-admin hidden>⚙ Manage</a>
          <button type="button" role="menuitem" id="btn-display-name">Display name</button>
          <button type="button" role="menuitem" id="btn-my-players">🎮 My Minecraft accounts</button>
          <button type="button" role="menuitem" id="btn-password">Change password</button>
          <button type="button" role="menuitem" id="btn-logout">Sign out</button>
        </div>
      </div>
    </header>
    <div id="app-board" class="board-stack" hidden></div>
    <!-- Manage (admins): everything about the whole site in one place, each part a tab -->
    <nav class="manage-nav tabs" id="manage-nav" aria-label="Manage" hidden>
      <select class="input manage-select" id="manage-select" aria-label="Manage: which page"></select>
      <a href="#/manage/announcements" data-m="announcements">📣 Announcements</a>
      <a href="#/manage/website" data-m="website">🌐 Website</a>
      <a href="#/manage/users" data-m="users">👥 Users</a>
      <a href="#/manage/whitelist" data-m="whitelist">✅ Whitelist</a>
      <a href="#/manage/servers" data-m="servers">🖥 Servers &amp; live info</a>
      <a href="#/manage/activity" data-m="activity">📜 Activity log</a>
      <a href="#/manage/votes" data-m="votes">🗳️ Votes</a>
      <a href="#/manage/messages" data-m="messages">✉️ Messages <span class="cm-badge" id="menu-admin-unread" hidden></span></a>
      <a href="#/manage/playtime" data-m="playtime">⏰ Play time</a>
      <a href="#/manage/holidays" data-m="holidays">📅 Holidays</a>
      <a href="#/manage/notifications" data-m="notifications">🔔 Notifications</a>
    </nav>
    <main id="view" tabindex="-1"></main>
    <footer class="app-foot muted">Solstone {{VERSION}}</footer>
  </div>
  <div id="login-root" hidden></div>
  <div id="tooltip" class="mc-tooltip" role="tooltip" hidden></div>
  <div id="modal-root"></div>
  <div id="toast" class="toast" hidden></div>
  <script src="/static/sky.js" defer></script>
  <script src="/static/showbar.js" defer></script>
  <script src="/static/login.js" defer></script>
  <script src="/static/hud.js" defer></script>
  <script src="/static/board.js" defer></script>
  <script src="/static/recap.js" defer></script>
  <script src="/static/app.js" defer></script>
  <script src="/static/history.js" defer></script>
  <script src="/static/control.js" defer></script>
  <script src="/static/play.js" defer></script>
  <script src="/static/adventures.js" defer></script>
  <script src="/static/editor.js" defer></script>
  <script src="/static/fwsettings.js" defer></script>
  <script src="/static/announce.js" defer></script>
  <script src="/static/postfmt.js" defer></script>
  <script src="/static/guides.js" defer></script>
  <script src="/static/website.js" defer></script>
  <script src="/static/playtime.js" defer></script>
  <script src="/static/community.js" defer></script>
</body>
</html>
