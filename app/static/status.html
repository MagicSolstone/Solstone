<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f1424">
  <title>Live status · {{SITE_NAME}}</title>
  <meta name="site-name" content="{{SITE_NAME}}">
  <link rel="icon" href="/static/solstone.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="status-page">
  <canvas id="status-sky" aria-hidden="true"></canvas>
  <div class="sp">
    <header class="hp-top sp-site">
      <a class="brand" href="/">
        <img src="/static/solstone.svg" alt="" width="34" height="34">
        <span>{{SITE_NAME}}</span>
      </a>
      <nav class="hp-nav" aria-label="Site">
        <a href="/">Home</a>
        <a href="/news">News</a>
        <a href="/guides">Guides</a>
        <a href="/faq">FAQ</a>
        <a href="/status" aria-current="page">Live status</a>
      </nav>
      <a class="btn sm" href="/app">Sign in</a>
    </header>
    <div class="sp-top">
      <nav class="sp-servers" id="sp-servers" aria-label="Servers"></nav>
      <div class="sp-right">
        <span class="sp-updated" id="sp-updated" aria-live="polite"></span>
        <span class="tv-clock" id="tv-clock" aria-hidden="true"></span>
        <button class="sp-btn sp-tv" id="sp-tv" type="button" aria-pressed="false" title="TV mode: full screen, and the screens play by themselves" aria-label="TV mode">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4" width="19" height="13" rx="2"/><path d="M8 21h8M12 17v4M7 8.5V7h1.5M17 8.5V7h-1.5M7 12.5V14h1.5M17 12.5V14h-1.5"/></svg>
          <span>TV mode</span></button>
      </div>
    </div>
    <div id="sp-board" class="board-stack" hidden></div>
    <main id="sp-main" class="sp-main"><p class="muted sp-loading">Loading…</p></main>
  </div>
  <div id="sp-toast" class="toast" hidden></div>
  <script src="/static/sky.js" defer></script>
  <script src="/static/showbar.js" defer></script>
  <script src="/static/hud.js" defer></script>
  <script src="/static/board.js" defer></script>
  <script src="/static/recap.js" defer></script>
  <script src="/static/status.js" defer></script>
</body>
</html>
