services:
  solstone:
    image: ghcr.io/magicsolstone/solstone:latest
    # :latest = :stable, updates with each released version. Pin a version (:1.2.0) to stay put.
    # To build from local source instead, comment image: and uncomment:
    # build: .
    container_name: solstone
    restart: unless-stopped
    ports:
      - "8085:8080"
    environment:
      # Crafty Controller 4 (Settings > Users > your user > API Keys)
      CRAFTY_URL: https://192.168.150.10:8443
      CRAFTY_TOKEN: change-me
      CRAFTY_VERIFY_SSL: "false"        # Crafty uses a self-signed cert by default
      PUID: "99"                        # Unraid nobody:users; use your `id -u`/`id -g` elsewhere
      PGID: "100"
      TZ: America/Chicago
      # RCON_HOST: 192.168.150.10       # where Minecraft RCON ports are published (defaults to the Crafty host)
      # ADMIN_PASSWORD: choose-something-long   # first admin's password; generated into the log if unset
      # TRUST_PROXY_HEADERS: "true"     # ONLY behind Cloudflare Tunnel or a reverse proxy you control
      # PUBLIC_URL: https://playsolstone.com   # the address people use; links Solstone hands out (the modpack) use it
      # NTFY_URL: https://ntfy.sh/your-secret-topic   # or set notifications up in the UI
      # MUSIC_LIBRARY_DIR: /music       # with the music folder mounted below
    volumes:
      # Crafty's servers folder, read-only. With the Unraid Crafty template
      # this is usually /mnt/user/appdata/crafty-4/servers
      - /mnt/user/appdata/crafty-4/servers:/servers:ro
      # Optional: Crafty's backups folder, read-only, for backup status
      - /mnt/user/appdata/crafty-4/backups:/backups:ro
      # Optional: a music library to share in Solstone's Music page, e.g. Jellyfin's.
      # The library is read-only; only its Solstone folder can be written (uploads).
      # Also set MUSIC_LIBRARY_DIR: /music above.
      # - /mnt/user/media/music:/music:ro
      # - /mnt/user/media/music/Solstone:/music/Solstone
      # Solstone settings + downloaded item icons
      - /mnt/user/appdata/solstone:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
